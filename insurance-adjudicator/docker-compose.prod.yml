services:
  api:
    build:
      context: .
      target: production
    image: insurance-adjudicator:${APP_VERSION:-2.0.0}
    ports:
      - "${API_PORT:-8000}:8000"
    environment:
      ENVIRONMENT: production
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_NAME: ${DB_NAME:-insurance_adjudicator}
      DB_USER: ${DB_USER:-insurance_app}
      DB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD}
      DB_AUTO_CREATE_TABLES: "false"
      DB_SSL_MODE: ${DB_SSL_MODE:-prefer}
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      REDIS_PASSWORD: ${REDIS_PASSWORD:?Set REDIS_PASSWORD}
      LLM_PROVIDER: ${LLM_PROVIDER:?Set LLM_PROVIDER}
      LLM_API_KEY: ${LLM_API_KEY:?Set LLM_API_KEY}
      LLM_MODEL: ${LLM_MODEL:?Set LLM_MODEL}
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:?Set ENCRYPTION_KEY}
      API_KEYS: ${API_KEYS:?Set API_KEYS}
      CORS_ORIGINS: ${CORS_ORIGINS:?Set CORS_ORIGINS}
      ALLOWED_HOSTS: ${ALLOWED_HOSTS:?Set ALLOWED_HOSTS}
      FF_USE_DATABASE: "true"
      FF_RATE_LIMITING: "true"
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      ENABLE_TRACING: ${ENABLE_TRACING:-true}
      JAEGER_ENDPOINT: ${JAEGER_ENDPOINT:-}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import httpx; r=httpx.get('http://127.0.0.1:8000/health', timeout=5); raise SystemExit(0 if r.status_code < 500 else 1)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

  worker:
    image: insurance-adjudicator:${APP_VERSION:-2.0.0}
    build:
      context: .
      target: production
    command: python -m src.workers.claim_processor
    environment:
      ENVIRONMENT: production
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_NAME: ${DB_NAME:-insurance_adjudicator}
      DB_USER: ${DB_USER:-insurance_app}
      DB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD}
      DB_AUTO_CREATE_TABLES: "false"
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      REDIS_PASSWORD: ${REDIS_PASSWORD:?Set REDIS_PASSWORD}
      LLM_PROVIDER: ${LLM_PROVIDER:?Set LLM_PROVIDER}
      LLM_API_KEY: ${LLM_API_KEY:?Set LLM_API_KEY}
      LLM_MODEL: ${LLM_MODEL:?Set LLM_MODEL}
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:?Set ENCRYPTION_KEY}
      API_KEYS: ${API_KEYS:?Set API_KEYS}
      CORS_ORIGINS: ${CORS_ORIGINS:?Set CORS_ORIGINS}
      ALLOWED_HOSTS: ${ALLOWED_HOSTS:?Set ALLOWED_HOSTS}
      FF_USE_DATABASE: "true"
      FF_RATE_LIMITING: "true"
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${DB_NAME:-insurance_adjudicator}
      POSTGRES_USER: ${DB_USER:-insurance_app}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-insurance_app} -d ${DB_NAME:-insurance_adjudicator}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: ["sh", "-c", "redis-server --appendonly yes --requirepass \"$REDIS_PASSWORD\""]
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?Set REDIS_PASSWORD}
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$REDIS_PASSWORD\" ping | grep PONG"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
