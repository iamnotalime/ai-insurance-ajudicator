global:
  scrape_interval: 15s
  evaluation_interval: 15s
  scrape_timeout: 10s

scrape_configs:
  - job_name: "insurance-adjudicator-api"
    metrics_path: "/metrics"
    static_configs:
      - targets: ["api:8000"]
        labels:
          service: "insurance-adjudicator"
          component: "api"

  - job_name: "prometheus"
    static_configs:
      - targets: ["localhost:9090"]
